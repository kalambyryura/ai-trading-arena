<title id="t">Fast bots: they gained 0.6 bps a trade and paid 10</title><desc id="d">Horizontal bars in basis points over 72 live trades: average move in the bot's favour +0.6, fee for entry and exit −10.0, typical price move during a trade 12.5 in either direction.</desc>
